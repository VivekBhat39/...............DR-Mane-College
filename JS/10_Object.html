<body>

    <h1>Object</h1>

    <script>
        // How to declare Object
        // let obj = {};
        // let obj2 = new Object();

        // console.log(obj);
        // console.log(obj2);

        // ---------------------------------------------------------
        // How to store data in Object => key value pair
        let student = {
            "name": "Rashmi",
            "name": "Reshma",
            age: 24,
            "job": true,
            hobbies: ["Coding", "Singing", "Reading"],
            food: {
                homemade_food: "Modak",
                street_food: "Wada-Paav"
            }
        };

        console.log(student);

        // How to access data from Object => ObjectName . KeyName
        console.log(student.name);
        console.log(student.age);
        console.log(student.hobbies);
        console.log(student.hobbies[1]);
        console.log(student.food);
        console.log(student.food.homemade_food);


        // How to add data in an Object => objectName.keyname = "assign_Value"

        student.gender = "Female";
        console.log(student);


















    </script>
</body>
